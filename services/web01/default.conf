server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bare "/" -> French version. 302 (temporary) so it's easy to
    # change later if you add a real language switcher instead.
    location = / {
        return 302 /fr/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
