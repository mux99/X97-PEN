listen=YES
listen_ipv6=NO

# --- Weakness: anonymous access enabled, with write access ---
anonymous_enable=YES
anon_root=/srv/ftp/pub
anon_upload_enable=YES
anon_mkdir_write_enable=YES
no_anon_password=YES

# --- Local (real) accounts can also log in ---
local_enable=YES
write_enable=YES
chroot_local_user=YES
local_root=/srv/ftp/cnc-programs
allow_writeable_chroot=YES

# --- Cleartext control channel: no TLS configured on purpose ---
# (teaching point: creds + file transfers are visible in Wireshark)

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

xferlog_enable=YES
xferlog_std_format=YES

dirmessage_enable=YES
ftpd_banner=Welcome to Norvantec Precision CNC file exchange (FTP)
