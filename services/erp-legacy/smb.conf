[global]
   workgroup = NORVANTEC
   server string = ERP-LEGACY - Production Planning (do not decommission - ext. 204)
   netbios name = ERPLEGACY
   security = user
   map to guest = Bad User
   guest account = nobody

   log file = /var/log/samba/log.%m
   max log size = 1000

[ERP_Import]
   comment = CNC/ERP data import drop folder
   path = /srv/erp/import
   browseable = yes
   guest ok = yes
   writable = yes
   create mask = 0777
   directory mask = 0777
