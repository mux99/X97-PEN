[global]
   workgroup = NORVANTEC
   server string = fs01 - Corporate File Server
   netbios name = FS01
   security = user

   # --- Weakness: guest/null session browsing allowed ---
   map to guest = Bad User
   guest account = nobody
   null passwords = yes

   log file = /var/log/samba/log.%m
   max log size = 1000

[Public]
   comment = Company-wide shared drive
   path = /srv/samba/public
   browseable = yes
   guest ok = yes
   read only = no

[HR]
   comment = HR documents (restricted)
   path = /srv/samba/hr
   browseable = yes
   guest ok = no
   valid users = t.ricard
   read only = no
